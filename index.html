<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline';">
    <title>عالم الأعمال والبنك الاستثماري</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <!-- الشريط العلوي: الرصيد بالريال وحالة الأمان -->
        <header class="top-bar">
            <div class="brand">🏛️ البنك الاستثماري وشبكة الشركات</div>
            <div class="wallet">
                <span>الرصيد: <strong id="balanceDisplay">10,000</strong> ر.س</span>
                <span class="sec-badge">🛡️ نظام محمي</span>
            </div>
        </header>

        <!-- لوحة التحكم السريعة عند الاقتراب من مبنى -->
        <div id="actionPanel" class="action-panel">
            <span id="locationTitle">اضغط أو المس أي مكان في الخريطة للتحرك 🚶‍♂️</span>
            <div id="locationButtons" class="btn-group"></div>
        </div>

        <!-- ساحة اللعبة التفاعلية (Canvas) -->
        <div class="canvas-container">
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- شريط التنبيهات الآمن -->
        <div id="statusLog" class="status-log">مرحباً بك! تحرك نحو البنك أو الشركات لإدارة استثماراتك بالريال السعودي.</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
