<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
    <title>محاكي الاقتصاد والمطار والموانئ البحرية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <header class="top-bar">
            <div class="stat-pill">💰 الرصيد: <strong id="balanceDisplay">15,000</strong> ر.س</div>
            <div class="stat-pill">🎂 العمر: <strong id="ageDisplay">25</strong> سنة</div>
            <div class="stat-pill">🎓 الخبرة: <strong id="expDisplay">1</strong> سنة</div>
            <div class="stat-pill">📦 مخزون المتجر: <strong id="stockDisplay">200,000</strong></div>
            <div class="stat-pill warning">⚖️ الضريبة: <strong id="taxDisplay">3.0</strong>%</div>
            <div class="stat-pill danger">🏦 القروض: <strong id="loansDisplay">0</strong> / 3</div>
        </header>

        <div id="actionPanel" class="action-panel">
            <span id="locationTitle">المس أو انقر على أي مبنى أو المطار أو الميناء للتحرك إليه 🚶‍♂️</span>
            <div id="locationButtons" class="btn-group"></div>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div id="statusLog" class="status-log">مرحباً! استكشف المطار بالوسط، الميناء البحري، والشركات الأربع لإدارة المهام.</div>
    </div>

    <div id="endModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="endTitle"></h2>
            <p id="endDesc"></p>
            <button id="restartBtn">إعادة اللعب من جديد 🔄</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
